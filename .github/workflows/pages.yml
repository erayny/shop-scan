name: Test and publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: npm ci
      - run: npm test
      - name: Build web app, then Liftside Bridge for Windows (web app embedded)
        run: |
          ./tools/build-bridge.sh
          mkdir -p dist/downloads
          cp dist-bridge/liftside-bridge-32.exe dist-bridge/liftside-bridge-64.exe dist/downloads/
          (cd dist/downloads && sha256sum *.exe > SHA256SUMS.txt)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
